name: build

on:
  push:
  pull_request:

jobs:
 forward:
   runs-on: ubuntu-latest

   strategy:
     matrix:
      include:
        - exp: "offline_exf_seaice"
        - exp: "global_ocean.cs32x15"
        - exp: "tutorial_deep_convection"
        - exp: "aim.5l_cs"
        - exp: "isomip"
        - exp: "global_ocean.90x40x15"
        - exp: "tutorial_plume_on_slope"
        - exp: "tutorial_advection_in_gyre"
        - exp: "hs94.cs-32x32x5"
        - exp: "tutorial_global_oce_biogeo"
        - exp: "tutorial_global_oce_in_p"
        - exp: "tutorial_cfc_offline"

   continue-on-error: true

   steps:

     - name: Checkout
       uses: actions/checkout@v2.2.0

     - name: Set up compilers
       run: |
         sudo apt-get update
         sudo apt-get -qq install gfortran

     - name: Get a docker image and set it running
       run: |
         docker pull mitgcm/testreport-images:ubuntu_18_04_villon
         docker run  -v `pwd`:/MITgcm --name ubuntu_18_04-testreport -t -d mitgcm/testreport-images:ubuntu_18_04_villon /bin/bash

     - name: Run a test
       env:
        MITGCM_EXP: ${{ matrix.exp }}
       run: |
         . tools/ci/runtr.sh

 flang:
   runs-on: ubuntu-24.04

   strategy:
     matrix:
      llvm: [ "23" ]
      exp:
        - "offline_exf_seaice"
        - "global_ocean.cs32x15"
        - "tutorial_deep_convection"
        - "aim.5l_cs"
        - "isomip"
        - "global_ocean.90x40x15"
        - "tutorial_plume_on_slope"
        - "tutorial_advection_in_gyre"
        - "hs94.cs-32x32x5"
        - "tutorial_global_oce_biogeo"
        - "tutorial_global_oce_in_p"
        - "tutorial_cfc_offline"

   continue-on-error: true

   steps:

     - name: Checkout
       uses: actions/checkout@v4

     - name: Set up LLVM flang
       env:
        LLVM_VERSION: ${{ matrix.llvm }}
       run: |
         wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
         echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
         sudo apt-get update
         sudo apt-get -qq install flang-${LLVM_VERSION} clang-${LLVM_VERSION}
         flang-${LLVM_VERSION} --version

     - name: Run a test
       env:
        FC: flang-${{ matrix.llvm }}
        CC: clang-${{ matrix.llvm }}
        MITGCM_EXP: ${{ matrix.exp }}
        MITGCM_DECMD: "bash -c"
        MITGCM_ROOT: ${{ github.workspace }}
        MITGCM_TROPT: "-devel -of=../tools/build_options/linux_amd64_flang -match 14"
       run: |
         # flang places large local arrays on the stack
         ulimit -s unlimited
         . tools/ci/runtr.sh

 tapenade:
   runs-on: ubuntu-latest

   strategy:
     matrix:
      include:
        - exp: "halfpipe_streamice"
        - exp: "global_oce_latlon"

   continue-on-error: true

   steps:

     - name: Checkout
       uses: actions/checkout@v2.2.0

     - name: Get a docker image and set it running
       run: |
         docker pull mitgcm/tapenade-ubuntu:latest
         docker run -i -t -v `pwd`:/MITgcm -d --name tapenade-testing --ulimit stack=-1:-1 --memory=4g -e _JAVA_OPTIONS=-Xmx2560m --rm mitgcm/tapenade-ubuntu:latest /bin/bash

     - name: Run testreport
       env:
        MITGCM_EXP: ${{ matrix.exp }}
        MITGCM_DECMD: "docker exec -i tapenade-testing bash -lc"
        MITGCM_TROPT: "-tap -adm -ncad -of=../tools/build_options/linux_amd64_gfortran -match 14"
        MITGCM_INPUT_DIR_PAT: '/input_tap.*'
       run: |
         . tools/ci/runtr.sh

 tapenade-other:
   runs-on: ubuntu-latest
   if: ${{ contains(github.event.pull_request.labels.*.name, 'adjoint') }}

   strategy:
     matrix:
      include:
        - exp: "global_oce_biogeo_bling"
        - exp: "global_ocean.cs32x15"
        - exp: "isomip"
        - exp: "lab_sea"
        - exp: "tutorial_global_oce_biogeo"
        - exp: "tutorial_tracel_adjsens"

   continue-on-error: true

   steps:

     - name: Checkout
       uses: actions/checkout@v2.2.0

     - name: Get a docker image and set it running
       run: |
         docker pull mitgcm/tapenade-ubuntu:latest
         docker run -i -t -v `pwd`:/MITgcm -d --name tapenade-testing --ulimit stack=-1:-1 --memory=4g -e _JAVA_OPTIONS=-Xmx2560m --rm mitgcm/tapenade-ubuntu:latest /bin/bash

     - name: Run testreport
       env:
        MITGCM_EXP: ${{ matrix.exp }}
        MITGCM_DECMD: "docker exec -i tapenade-testing bash -lc"
        MITGCM_TROPT: "-tap -adm -ncad -of=../tools/build_options/linux_amd64_gfortran -match 14"
        MITGCM_INPUT_DIR_PAT: '/input_tap.*'
       run: |
         . tools/ci/runtr.sh

 doc_html:
   runs-on: ubuntu-latest

   continue-on-error: true

   steps:
     - name: Checkout
       uses: actions/checkout@v2.2.0

     - name: Set up Python
       uses: actions/setup-python@v2
       with:
         python-version: 3.11

     - name: install dependencies
       run: tools/ci/install_doc_dependencies.sh

     - name: build docs
       run: |
         cd doc
         sphinx-build -Wa -b html -d _build_doctrees . _build/html

 doc_latex:
   runs-on: ubuntu-latest

   continue-on-error: true

   steps:
     - name: Checkout
       uses: actions/checkout@v2.2.0

     - name: Set up Python
       uses: actions/setup-python@v2
       with:
         python-version: 3.11

     - name: install dependencies
       run: tools/ci/install_doc_dependencies.sh

     - name: build docs
       run: |
         cd doc
         make clean latexpdf LATEXOPTS="-interaction=nonstopmode -halt-on-error"
